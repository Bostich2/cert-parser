[project]
name = "cert-parser"
dynamic = ["version"]
description = "Lookup EAEU conformity certificates by registration number (BY, RU, KZ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "truststore==0.10.4",
    "pymupdf==1.28.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.29.0",
    "openpyxl==3.1.5",
    "slowapi==0.1.10",
    "itsdangerous==2.2.0",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "setuptools-scm>=8.0",
]

[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/cert_parser/_version.py"
fallback_version = "0.0.0.dev0"

[tool.setuptools_scm.tag]
regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cert_parser = ["web/templates/*.html", "web/static/*", "web/static/flags/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
