services:
  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.2.0}
    expose:
      - "8000"
    env_file:
      - .env.prod
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ENV: production
      CACHE_PATH: /app/data/cache.sqlite
      AUTH_ENABLED: "true"
      AUTH_SECURE_COOKIES: "true"
    volumes:
      - sert-parser-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sert-parser-data:
  caddy-data:
  caddy-config:
