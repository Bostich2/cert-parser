services:
  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.2.0}
    expose:
      - "8000"
    env_file:
      - .env.prod
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ENV: production
      CACHE_PATH: /app/data/cache.sqlite
      AUTH_ENABLED: "true"
      AUTH_SECURE_COOKIES: "true"
    volumes:
      - cert-parser-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    profiles: ["standalone"]
    build:
      context: ./deploy
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${ALLOWED_HOSTS:-example.com}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cert-parser-data:
  caddy-data:
  caddy-config:
